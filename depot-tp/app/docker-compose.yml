# TP3 - Déploiement avec Docker Compose
#   Sur la VM ci     : HOST_PORT=9090 TAG=1.0 docker compose up -d   (8080 est pris par Jenkins)
#   Sur la VM target : TAG=1.0 docker compose up -d
services:
  app:
    image: ${IMAGE:-192.168.56.10:5000/devops-demo}:${TAG:-latest}
    container_name: devops-demo
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      APP_VERSION: ${TAG:-latest}
    restart: unless-stopped
