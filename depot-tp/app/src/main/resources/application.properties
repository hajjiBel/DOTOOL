spring.application.name=devops-demo
server.port=8080
app.version=${APP_VERSION:1.0.0}

# Actuator + Prometheus (TP6) et sondes Kubernetes (TP7)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Format de log stable, analysé par Logstash (TP5)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
