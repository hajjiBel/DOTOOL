global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques système (node_exporter est installé sur chaque VM)
  - job_name: node
    static_configs:
      - targets: ["192.168.56.10:9100"]
        labels: { host: ci }
      - targets: ["192.168.56.11:9100"]
        labels: { host: target }
      - targets: ["192.168.56.12:9100"]
        labels: { host: monitor }
      # Décommentez si les VM correspondantes sont démarrées :
      # - targets: ["192.168.56.13:9100"]
      #   labels: { host: elk }
      # - targets: ["192.168.56.14:9100"]
      #   labels: { host: k8s }

  # Application Spring Boot déployée en conteneur sur la VM target
  - job_name: app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["192.168.56.11:8080"]
        labels: { env: test }

  # Application sur Kubernetes (NodePort) - à décommenter au TP7
  # - job_name: app-k8s
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["192.168.56.14:30080"]
