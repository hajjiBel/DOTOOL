apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo
  labels: { app: devops-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: devops-demo }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: devops-demo }
    spec:
      containers:
        - name: app
          image: 192.168.56.10:5000/devops-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "k8s"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
            periodSeconds: 10
