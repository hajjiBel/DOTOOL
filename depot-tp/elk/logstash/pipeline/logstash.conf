input {
  beats { port => 5044 }
}

filter {
  if [log_type] == "nginx" {
    # Logs d'accès Nginx (format combined)
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      tag_on_failure => ["_nginx_parse_failure"]
    }
    if [response] {
      mutate { convert => { "response" => "integer" } }
    }
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }
  } else {
    # Logs Spring Boot : 2026-10-03T10:00:00.000+01:00 INFO  [main] logger - message
    grok {
      match => { "message" => "(?m)%{TIMESTAMP_ISO8601:log_time} %{LOGLEVEL:level}\s+\[%{DATA:thread}\] %{NOTSPACE:logger} - %{GREEDYDATA:log_message}" }
      tag_on_failure => ["_not_spring_log"]
    }
    if [log_message] =~ /Exception/ {
      mutate { add_tag => ["java_exception"] }
    }
    if [log_time] {
      date { match => ["log_time", "ISO8601"] target => "@timestamp" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devops-logs-%{+YYYY.MM.dd}"
  }
}
